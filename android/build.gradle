buildscript {
    repositories {
        google() // Phải có google()
        mavenCentral() // Nên có mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0' // Tương thích với Gradle 8.9
        classpath 'com.google.gms:google-services:4.3.15' // Đảm bảo khai báo plugin này
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}



rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
